<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voce &amp; Parole</title>
<style>
  :root { --bg:#3b82f6; --fg:#ffffff; --size:56px; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:var(--bg); color:var(--fg);
    transition: background .4s, color .4s;
    display:flex; flex-direction:column; min-height:100vh;
  }
  header { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between;
    padding:12px 18px; background:rgba(0,0,0,.22); backdrop-filter:blur(6px); }
  h1 { font-size:18px; margin:0; font-weight:700; letter-spacing:.3px; }
  .group { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .swatch { width:26px; height:26px; border-radius:50%; border:2px solid rgba(255,255,255,.7); cursor:pointer; padding:0; }
  .swatch.active { outline:3px solid #fff; outline-offset:2px; }
  label { font-size:13px; opacity:.95; }
  select, input[type=color] { border-radius:8px; border:none; padding:5px 8px; font-size:14px; }
  input[type=range] { width:110px; }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:28px 6vw; overflow-y:auto; }
  #words { font-size:var(--size); line-height:1.25; font-weight:700; text-align:center; max-width:1200px; width:100%;
    word-wrap:break-word; text-shadow:0 2px 12px rgba(0,0,0,.15); }
  #words .interim { opacity:.6; }
  #words.placeholder { opacity:.55; font-weight:500; font-size:calc(var(--size)*.5); }
  footer { padding:14px 18px 20px; background:rgba(0,0,0,.22); backdrop-filter:blur(6px);
    display:flex; flex-direction:column; gap:12px; align-items:center; }
  .controls { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; align-items:center; }
  button.btn { border:none; border-radius:999px; padding:12px 22px; font-size:16px; font-weight:600; cursor:pointer;
    background:#fff; color:#111; display:flex; align-items:center; gap:8px; transition:transform .1s, opacity .2s; }
  button.btn:hover:not(:disabled) { transform:scale(1.04); }
  button.btn:disabled { opacity:.4; cursor:not-allowed; }
  #rec { background:#ef4444; color:#fff; padding:14px 28px; font-size:18px; }
  #rec.on { animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(239,68,68,.7);} 70%{box-shadow:0 0 0 18px rgba(239,68,68,0);} 100%{box-shadow:0 0 0 0 rgba(239,68,68,0);} }
  .dot { width:12px; height:12px; border-radius:50%; background:currentColor; }
  .sq { width:12px; height:12px; background:currentColor; }
  audio { width:min(520px,90vw); height:40px; }
  #status { font-size:13px; opacity:.9; min-height:18px; text-align:center; }
  #timer { font-variant-numeric:tabular-nums; font-weight:600; min-width:48px; }
</style>
</head>
<body>
<header>
  <h1>🎙️ Voce &amp; Parole</h1>
  <div class="group" id="swatches"></div>
  <div class="group">
    <label>Sfondo <input type="color" id="customBg" value="#3b82f6"></label>
    <label>Lingua
      <select id="lang">
        <option value="it-IT">Italiano</option>
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="es-ES">Español</option>
        <option value="fr-FR">Français</option>
        <option value="de-DE">Deutsch</option>
      </select>
    </label>
    <label>Testo <input type="range" id="size" min="24" max="140" value="56"></label>
    <button class="btn" id="full" style="padding:6px 14px;font-size:13px">⛶ Schermo intero</button>
  </div>
</header>

<main><div id="words" class="placeholder">Premi “Registra” e parla: le parole appariranno qui.</div></main>

<footer>
  <div class="controls">
    <button class="btn" id="rec"><span class="dot"></span><span id="recLabel">Registra</span></button>
    <span id="timer">0:00</span>
  </div>
  <audio id="player" controls hidden></audio>
  <div class="controls">
    <button class="btn" id="dl" disabled>⬇ Scarica audio</button>
    <button class="btn" id="copy" disabled>📋 Copia testo</button>
    <button class="btn" id="clear" disabled>🗑 Cancella</button>
  </div>
  <div id="status"></div>
</footer>

<script>
const $ = id => document.getElementById(id);
const words = $('words'), player = $('player'), statusEl = $('status');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

/* ---------- Colori ---------- */
const palette = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#111827','#fde047'];
function luminance(hex){
  const n = parseInt(hex.slice(1),16), r=n>>16&255, g=n>>8&255, b=n&255;
  return (0.299*r+0.587*g+0.114*b)/255;
}
function setBg(hex){
  document.documentElement.style.setProperty('--bg', hex);
  document.documentElement.style.setProperty('--fg', luminance(hex) > 0.62 ? '#111827' : '#ffffff');
  $('customBg').value = hex;
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.c === hex));
}
palette.forEach(c => {
  const b = document.createElement('button');
  b.className = 'swatch'; b.style.background = c; b.dataset.c = c; b.title = c;
  b.onclick = () => setBg(c);
  $('swatches').appendChild(b);
});
$('customBg').oninput = e => setBg(e.target.value);
$('size').oninput = e => document.documentElement.style.setProperty('--size', e.target.value + 'px');
$('full').onclick = () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); };
setBg(palette[0]);

/* ---------- Stato ---------- */
let stream, mediaRec, chunks = [], recognition, recording = false;
let startTime = 0, timerInt, events = [], blobUrl = null, audioBlob = null, lastFinal = '';

function setStatus(t){ statusEl.textContent = t || ''; }
function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function render(final, interim){
  if (!final && !interim){ words.className='placeholder'; words.textContent='Premi “Registra” e parla: le parole appariranno qui.'; return; }
  words.className = '';
  words.innerHTML = esc(final) + (interim ? ' <span class="interim">' + esc(interim) + '</span>' : '');
  words.parentElement.scrollTop = words.parentElement.scrollHeight;
}
function fmt(s){ s = Math.floor(s); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

/* ---------- Riconoscimento vocale ---------- */
function startRecognition(){
  if (!SR){ setStatus('Il riconoscimento vocale non è supportato da questo browser: usa Chrome o Edge. L’audio verrà comunque registrato.'); return; }
  recognition = new SR();
  recognition.lang = $('lang').value;
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onresult = ev => {
    let fin = '', interim = '';
    for (let i = 0; i < ev.results.length; i++){
      const r = ev.results[i];
      if (r.isFinal) fin += r[0].transcript + ' '; else interim += r[0].transcript;
    }
    const base = lastFinal;
    const finalAll = (base + fin).trim();
    events.push({ t: (performance.now() - startTime) / 1000, fin: finalAll, interim });
    render(finalAll, interim);
  };
  recognition.onerror = e => { if (e.error !== 'no-speech' && e.error !== 'aborted') setStatus('Errore riconoscimento: ' + e.error); };
  recognition.onend = () => {
    if (recording){
      // il motore si ferma da solo dopo i silenzi: lo riavvio mantenendo il testo già riconosciuto
      const cur = events.length ? events[events.length-1] : null;
      lastFinal = cur ? (cur.fin + (cur.interim ? ' ' + cur.interim : '')).trim() + ' ' : '';
      try { recognition.start(); } catch(e){}
    }
  };
  try { recognition.start(); } catch(e){}
}

/* ---------- Registrazione ---------- */
async function startRec(){
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio:true });
  } catch (err){
    setStatus('Microfono non disponibile: ' + err.message + '. Apri il file in Chrome/Edge e consenti l’accesso al microfono.');
    return;
  }
  player.hidden = true; player.pause();
  if (blobUrl){ URL.revokeObjectURL(blobUrl); blobUrl = null; }
  chunks = []; events = []; lastFinal = ''; audioBlob = null;
  render('', '');
  mediaRec = new MediaRecorder(stream);
  mediaRec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mediaRec.onstop = () => {
    audioBlob = new Blob(chunks, { type: mediaRec.mimeType || 'audio/webm' });
    blobUrl = URL.createObjectURL(audioBlob);
    player.src = blobUrl; player.hidden = false;
    stream.getTracks().forEach(t => t.stop());
    ['dl','copy','clear'].forEach(id => $(id).disabled = false);
    setStatus('Registrazione pronta: premi play. Le parole si ripresenteranno in sincrono con la voce.');
  };
  startTime = performance.now();
  mediaRec.start(250);
  recording = true;
  startRecognition();
  $('rec').classList.add('on');
  $('recLabel').textContent = 'Ferma';
  $('rec').querySelector('.dot').className = 'sq';
  timerInt = setInterval(() => $('timer').textContent = fmt((performance.now() - startTime)/1000), 250);
  setStatus('Sto ascoltando…');
}
function stopRec(){
  recording = false;
  clearInterval(timerInt);
  try { recognition && recognition.stop(); } catch(e){}
  if (mediaRec && mediaRec.state !== 'inactive') mediaRec.stop();
  $('rec').classList.remove('on');
  $('recLabel').textContent = 'Registra di nuovo';
  const s = $('rec').querySelector('.sq'); if (s) s.className = 'dot';
}
$('rec').onclick = () => recording ? stopRec() : startRec();

/* ---------- Riascolto con parole sincronizzate ---------- */
function showAt(t){
  let ev = null;
  for (let i = 0; i < events.length; i++){ if (events[i].t <= t) ev = events[i]; else break; }
  if (ev) render(ev.fin, ev.interim); else render('', '');
}
player.addEventListener('timeupdate', () => { if (!recording) showAt(player.currentTime + 0.15); });
player.addEventListener('seeked', () => showAt(player.currentTime + 0.15));
player.addEventListener('ended', () => {
  if (events.length){ const e = events[events.length-1]; render((e.fin + ' ' + e.interim).trim(), ''); }
});

/* ---------- Azioni ---------- */
function fullText(){ if (!events.length) return ''; const e = events[events.length-1]; return (e.fin + ' ' + e.interim).trim(); }
$('dl').onclick = () => {
  if (!blobUrl) return;
  const ext = (audioBlob.type.includes('ogg') ? 'ogg' : audioBlob.type.includes('mp4') ? 'm4a' : 'webm');
  const a = document.createElement('a'); a.href = blobUrl; a.download = 'registrazione.' + ext; a.click();
};
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(fullText()); setStatus('Testo copiato negli appunti.'); }
  catch(e){ setStatus('Impossibile copiare automaticamente.'); }
};
$('clear').onclick = () => {
  player.pause(); player.hidden = true; player.removeAttribute('src');
  if (blobUrl) URL.revokeObjectURL(blobUrl); blobUrl = null; audioBlob = null; events = []; chunks = [];
  render('', ''); $('timer').textContent = '0:00'; $('recLabel').textContent = 'Registra';
  ['dl','copy','clear'].forEach(id => $(id).disabled = true); setStatus('');
};

if (!SR) setStatus('Per vedere le parole serve Chrome o Edge (riconoscimento vocale). La registrazione audio funziona ovunque.');
</script>
</body>
</html>
